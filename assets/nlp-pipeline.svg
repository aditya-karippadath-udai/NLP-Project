</text>

<text x="160" y="1440" class="module-text">
• Top-k evidence selection
</text>

<!-- MODULE 6 -->

<rect class="box"
      x="120"
      y="1540"
      width="660"
      height="190"
      fill="#14532d"
      stroke="#4ade80"/>

<text x="160" y="1590" class="module-title">
Module 6 • Response Generation
</text>

<text x="160" y="1630" class="module-text">
• Supporting explanation generation
</text>

<text x="160" y="1660" class="module-text">
• Counterargument synthesis
</text>

<text x="160" y="1690" class="module-text">
• Balanced explainable responses
</text>

<!-- UI -->

<rect class="box"
      x="250"
      y="1800"
      width="400"
      height="90"
      fill="#111827"
      stroke="#c084fc"/>

<text x="320" y="1855" class="module-title">
Interactive Gradio UI
</text>

</svg>
