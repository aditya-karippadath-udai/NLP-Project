<svg width="100%" viewBox="0 0 900 1950" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#0d1117"/>
  <stop offset="100%" stop-color="#111827"/>
</linearGradient>

<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>

.title {
  fill: #f8fafc;
  font-family: Arial, sans-serif;
  font-size: 32px;
  font-weight: bold;
}

.subtitle {
  fill: #94a3b8;
  font-family: Arial, sans-serif;
  font-size: 15px;
}

.module-title {
  fill: white;
  font-family: Arial, sans-serif;
  font-size: 20px;
  font-weight: bold;
}

.module-text {
  fill: #cbd5e1;
  font-family: Arial, sans-serif;
  font-size: 13px;
}

.box {
  rx: 22;
  stroke-width: 2.5;
  filter: url(#glow);
}

.line {
  stroke: #8b5cf6;
  stroke-width: 4;
  fill: none;
  stroke-linecap: round;
}

.packet {
  fill: #c084fc;
  filter: url(#glow);
}

</style>

</defs>

<!-- BACKGROUND -->

<rect width="900" height="1950" fill="url(#bg)" rx="28"/>

<!-- HEADER -->

<text x="60" y="70" class="title">
Debate-Based NLP Architecture
</text>

<text x="60" y="105" class="subtitle">
Hybrid AI Pipeline • Retrieval-Augmented Reasoning • Evidence Synthesis
</text>

<!-- MAIN FLOW LINE -->

<path class="line" d="M450 160 V1810"/>

<!-- ANIMATED PACKET -->

<circle class="packet" r="7">
  <animateMotion dur="6s" repeatCount="indefinite"
    path="M450 160 V1810"/>
</circle>

<!-- MODULE 1 -->

<rect class="box"
      x="120"
      y="160"
      width="660"
      height="150"
      fill="#1e1b4b"
      stroke="#8b5cf6"/>

<text x="160" y="210" class="module-title">
Module 1 • Claim Extraction
</text>

<text x="160" y="245" class="module-text">
• FLAN-T5 prompt-based claim generation
</text>

<text x="160" y="270" class="module-text">
• Atomic claim extraction
</text>

<text x="160" y="295" class="module-text">
• Redundancy removal
</text>

<!-- MODULE 2 -->

<rect class="box"
      x="120"
      y="380"
      width="660"
      height="180"
      fill="#312e81"
      stroke="#a78bfa"/>

<text x="160" y="430" class="module-title">
Module 2 • Simplification + Enrichment
</text>

<text x="160" y="465" class="module-text">
• FLAN-T5 simplification
</text>

<text x="160" y="490" class="module-text">
• SpaCy NER
</text>

<text x="160" y="515" class="module-text">
• Wikipedia entity linking
</text>

<text x="160" y="540" class="module-text">
• Context-aware enrichment
</text>

<!-- MODULE 3 -->

<rect class="box"
      x="90"
      y="640"
      width="720"
      height="290"
      fill="#172554"
      stroke="#60a5fa"/>

<text x="140" y="695" class="module-title">
Module 3 • Debatability Classification
</text>

<text x="140" y="740" class="module-text">
• Layer 1 → Factual override rules
</text>

<text x="140" y="775" class="module-text">
• Layer 2 → Gemini 2.5 Flash reasoning
</text>

<text x="140" y="810" class="module-text">
• Layer 3 → Rule-based fallback
</text>

<text x="140" y="845" class="module-text">
• Layer 4 → DistilBERT zero-shot classification
</text>

<text x="140" y="880" class="module-text">
• Multi-layer hybrid validation
</text>

<!-- MODULE 4 -->

<rect class="box"
      x="120"
      y="1010"
      width="660"
      height="200"
      fill="#083344"
      stroke="#22d3ee"/>

<text x="160" y="1060" class="module-title">
Module 4 • Evidence Retrieval
</text>

<text x="160" y="1100" class="module-text">
• DDGS query generation
</text>

<text x="160" y="1130" class="module-text">
• HTML scraping + parsing
</text>

<text x="160" y="1160" class="module-text">
• Boilerplate removal
</text>

<text x="160" y="1190" class="module-text">
• Evidence chunk extraction
</text>

<!-- MODULE 5 -->

<rect class="box"
      x="120"
      y="1290"
      width="660"
      height="180"
      fill="#3f6212"
      stroke="#84cc16"/>

<text x="160" y="1340" class="module-title">
Module 5 • Evidence Filtering & Refinement
</text>

<text x="160" y="1380" class="module-text">
• Relevance ranking
</text>

<text x="160" y="1410" class="module-text">
