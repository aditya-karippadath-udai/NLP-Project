<svg viewBox="0 0 900 1900" xmlns="http://www.w3.org/2000/svg">

<style>

.title {
  fill: white;
  font-size: 32px;
  font-family: Arial;
  font-weight: bold;
  text-anchor: middle;
}

.subtitle {
  fill: #94a3b8;
  font-size: 15px;
  font-family: Arial;
  text-anchor: middle;
}

.module-title {
  fill: white;
  font-size: 20px;
  font-family: Arial;
  font-weight: bold;
  text-anchor: middle;
}

.module-text {
  fill: #cbd5e1;
  font-size: 13px;
  font-family: Arial;
  text-anchor: middle;
}

.line {
  stroke: #8b5cf6;
  stroke-width: 4;
}

.packet {
  fill: #c084fc;
}

</style>

<!-- Background -->

<rect width="900" height="1900" fill="#0d1117"/>

<!-- Header -->

<text x="450" y="70" class="title">
Debate-Based NLP Architecture
</text>

<text x="450" y="105" class="subtitle">
Hybrid AI Pipeline • Retrieval-Augmented Reasoning
</text>

<!-- Main Flow Line -->

<line x1="450" y1="150" x2="450" y2="1750" class="line"/>

<!-- Animated Packet -->

<circle r="10" class="packet">

  <animateMotion
    dur="5s"
    repeatCount="indefinite"
    path="M450 150 V1750"/>

  <animate
    attributeName="opacity"
    values="0.4;1;0.4"
    dur="1.5s"
    repeatCount="indefinite"/>

</circle>

<!-- Common Box Dimensions -->
<!-- x=150 width=600 -->

<!-- MODULE 1 -->

<rect x="150" y="160" width="600" height="140"
fill="#1e1b4b"
stroke="#8b5cf6"
stroke-width="2"
rx="20">

<animate attributeName="opacity"
values="0.85;1;0.85"
dur="3s"
repeatCount="indefinite"/>

</rect>

<text x="450" y="210" class="module-title">
Module 1 • Claim Extraction
</text>

<text x="450" y="245" class="module-text">
• FLAN-T5 prompt-based generation
</text>

<text x="450" y="270" class="module-text">
• Atomic claim extraction
</text>

